zh:
  label_redmine_mcp: Redmine MCP
  text_redmine_mcp_server_instructions: |
    Redmine MCP 路由规则：
    - 会话开始时调用 redmine_get_mcp_info，并根据返回的 capabilities 选择可选工具。
    - 若工单 ID 未知，请先通过 capabilities.issue_search 搜索，再调用 redmine_get_issue。
    - 语义、概念或相似度搜索请使用 redmine_get_mcp_info 报告的 semantic capability（若 available）。遵循 use_when 与 avoid_when。
    - 关键词、标识符、字段或精确文本搜索请使用 redmine_search_issues。
    - 若需要语义搜索但 capabilities.issue_search.semantic.available 为 false，请回退到 redmine_search_issues，并说明此次为词法而非语义搜索。
    - 当 capabilities.issue_search.cross_resource 可用时，使用 redmine_search_all 跨资源发现（含 Wiki）。
    - 若 project 未知，请先调用 redmine_list_projects。project 必须是字符串，如 "1" 或 "ecookbook"，不能是 JSON 数字。
    - 在 redmine_create_issue 或 redmine_update_issue 之前，若跟踪器、状态、经办人或自定义字段 ID 未知，请调用 redmine_get_issue_form_options。可选试运行：redmine_validate_issue_create / redmine_validate_issue_update。
    - 仅添加评论而不改工单字段时使用 redmine_add_issue_note。关注者使用 redmine_add_issue_watcher 或 redmine_remove_issue_watcher。
    - 项目内用户查询使用 redmine_list_users；全局管理员目录仅使用 redmine_admin_list_users。
    - 仅在用户明确需要日志或私有备注时请求 redmine_get_private_notes 或 include_journals。
    - 破坏性工具（如 redmine_delete_issue）可能需要确认；若返回 INVALID_STATE，请带上所需 confirm_* 参数重试。
    - 向用户引用工单时，请复制工具结果中的 url 字段。不要自行编造主机名。
    - 除 redmine_* 核心工具外，已安装插件的工具可能以各自前缀出现。
